# Optional Render Blueprint. Creates a demo web service only after you review
# and approve it in your own Render account. No database or paid plan requested.
services:
  - type: web
    name: mezo-compass
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: ENABLE_MAINNET_CLAIMS
        value: 'false'
